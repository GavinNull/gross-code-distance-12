id: E-033-gross-u11-ler
hypothesis: H-004（gross d_circ = 12 电路的实用价值；STATE 已确认 16 的 u11 是周期 11，比 p18 短 7 层）
reasoning: >
  已确认 16：u11（search/experiments/e032/u11_spec.json，周期 11，回绕，单辅助比特，平移不变）SD6 任意 R、两基底 d_circ = 12。
  E-026/E-026b（已确认 12 的同类结论）：周期 18 的 p18 在 λ = 1 下全输（空闲质量 2.9 倍），λ = 0 时对 Fig. 12 赢、对 IBM 不可分辨。
  E-030（[[90]]，未复核完）：周期 11 的 c11（d 10）对 IBM（d 8）λ = 0 每轮 0.4–0.65（独立复现 3e-3 为 0.57），λ = 0.1 不可分辨，λ = 1 输 6–17 倍。
  结构探针（probe.json，跑在本 yaml 之前，不含任何 LER）：每轮体内 DEM 720 列（三电路相同）；p = 1e-3 每轮先验质量 λ = 0 三者都是 0.796，
  λ = 0.1 u11 0.872 / ibm、fig12 0.815，λ = 1 u11 1.558 / ibm、fig12 0.987（1.58 倍，与 [[90]] c11/ibm 的 1.58 相同）；每轮空闲位置 u11 1152、另两者 288。
  理想解码器领头幂次：ibm（d 10）p^5，fig12（d 11）p^6，u11（d 12）p^6（⌈12/2⌉ = ⌈11/2⌉ = 6）。所以 u11 对 fig12 在领头阶只能靠系数赢，比值与 p 无关；对 ibm 理想交叉一定存在。
  ccsearch 的 Knuth 估计（只估节点数，不含解的个数）：u11 Z W = 12 枚举 R = 1 约 7e10 节点、R = 2 约 2e11（每基底约 1.5 h、5 h）；ibm Z W = 10：R = 1 3e8、R = 2 2e9（分钟级）。
  教训（E-023/E-026/E-026b/E-030 审计）：局部显式探测器（评估器模板）；所有电路同一解码器同一参数；Jeffreys 95%；报告失败数；λ 只缩放空闲通道；
  不写 "per unit time"，只写 per unit-duration layer 并附说明；领头阶是理想解码器下的并集形式估计，不是界，p ≥ 1e-3 不严格适用；不把单个少失败点当头条。
plan:
  1: LER（优先级 1）：λ = 0，p ∈ {5e-3, 4e-3, 3e-3, 2e-3}，u11 / fig12 / ibm，R = 12（= d，IBM 的 N_c，与 E-026/E-026b 同口径），Z、X 分别采样，ε = ε_Z + ε_X，
     BP-OSD（IBM 参数）与 Relay-BP（relay5），三电路完全相同（e026.decoders）；噪声 e026b.noisy_from（lam1 与评估器 sd6 逐字节相同，probe 已断言）。
     停止规则：每基底到 25（5e-3、4e-3）/ 20（3e-3）个失败或达到 shot 上限（按预算定，日志里写明）；2e-3 只给上限或少量计数，λ = 0 下预计分辨不了（如此则如实说明）。
     与 E-026/E-026b 同电路、同噪声、同解码器、同 R 的 ibm、fig12 已有 csv 在分析时合并（按 (noise, circ, p, decoder, basis) 汇总，分开列出新旧计数）。
  2: LER（优先级 2）：λ = 1，p ∈ {3e-3, 2e-3}（预算允许加 1.5e-3），u11 新采；ibm、fig12 合并 E-026 数据，2e-3 处补采。
  3: LER（优先级 3）：λ = 0.1，p ∈ {4e-3, 3e-3}（预算允许加 2e-3）。
  4: 阳性对照：ibm + BP-OSD，λ = 1，p = 4e-3，新种子重采，对 E-026（3.70e-3 [3.11, 4.43]e-3 每轮）与 IBM Table 6 拟合 pL = p^5 exp(18.04 + 1337p − 96007p^2)（2308.07915）。
  5: 领头阶：ccsearch（E-029，enum 模式，decide W−1 = NONE 之后）在完整 SD6 DEM 上精确枚举：u11 W = 12（Z：R = 1, 2, 3；X：R = 1，预算允许加 R = 2），
     ibm W = 10（先 decide 9；Z、X，R = 1..4）；72 平移展开、每个逻辑在 DEM 上复核；每轮个数 = R 差分，差分恒定才算饱和。
     fig12 W11 用 E-026 的完整计数（Z 34440、X 42648 每轮）与 W12(b) 族（不完整）。
     理想（最可能错误）解码器系数：u11 A6（6|6 平局计 1/2）、ibm A5（5|5 平局计 1/2）、fig12 A6（E-026b lead.json，只含已枚举族）；p* = A5(ibm)/A6(u11)；u11 对 fig12 给 A6 比值。λ ∈ {0, 0.1, 1}。
prediction: >
  （写于任何 LER 采样与枚举之前；依据只有上面的结构探针、E-026/E-026b/E-030 的经验）
  1) λ = 0：u11/ibm 每轮比值在 3e-3–4e-3 落在 [0.3, 1.5]：70%；其中 BP-OSD 至少一个 p 显著 < 1（95% 上限 < 1）：40%。
     u11/fig12 在 4e-3 显著 < 1（两种解码器至少一种）：70%（E-026b 中 fig12 在 λ = 0 比 ibm 差 2.6–4 倍，d 12 的 p18 赢 fig12 约 3 倍）。
     2e-3 处 λ = 0 三电路都分辨不了（每基底失败 < 5）：80%。
  2) λ = 1：u11/ibm 在 3e-3 落在 [3, 15]：60%；2e-3–5e-3 内无交叉（每个 p 的 u11 都不优于 ibm）：90%；u11/fig12 在 3e-3 > 1 显著：80%。
  3) λ = 0.1：u11/ibm 在 3e-3–4e-3 不可分辨（区间含 1）：55%；显著更差：35%；显著更好：10%。
  4) 阳性对照：新采 ibm λ = 1 4e-3 BP-OSD 与 E-026 之比在 [0.7, 1.4]：90%；与 Table 6 拟合之比在 [0.7, 1.5]：85%。
  5) 枚举：ibm decide 9 = NONE（d_circ = 10 恰好）：90%；ibm W10 每轮每基底在 [1e2, 1e4]：65%；
     u11 W12 每轮每基底在 [1e4, 1e6]：65%；u11 Z、X 计数相同：75%；u11 R = 2→3 差分与 R = 1→2 相同（R = 1→2 已饱和）：40%。
     u11 Z R = 3 的枚举能在预算内完成：60%。
  6) 理想交叉 p*（u11 对 ibm）：λ = 1 < 1e-4：75%；λ = 0 > 1e-3：50%。理想 A6 比值 u11/fig12：λ = 0 < 1：75%，λ = 1 > 1：70%。
