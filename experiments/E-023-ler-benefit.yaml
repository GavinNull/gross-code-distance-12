id: E-023-ler-benefit
hypothesis: H-004 / PRL 线 C（d_circ 提升是否带来可测的 LER 收益）
question: >
  同码、同比特、同深度、同噪声、同解码器、只换电路（CNOT 顺序）的 A/B 对照中，证明了的 d_circ +1（或 +2）
  能否换来可测的每轮逻辑错误率收益？特别是低 p（1e-4 .. 1e-3）区间：用固定权重故障采样 + 低权重逻辑错误枚举
  （“失效核”拆分）外推，给出带误差的 LER 比值和交叉点 p*（低于 p* 时高 d_circ 电路胜出）。
pairs: >
  P1 [[108,8,10]] 母码 f_y morphing → [[54,8,8]]：paper 序（d_circ = 6）对 repo 序（7），另 std01（6）对 std10（7）作重复；
  P2 [[144,12,12]] 母码 f_y morphing：sw11（6，端点 [[72,12,6]]）对 sw01（7，端点 [[72,12,7]]）——同一母码、同比特、同层结构，
     只换项序；注意端点码也随之不同（这是电路族本身的性质，报告时须注明）；
  P3 BB108：IBM 深度 8 原电路（≤ 8，实际最低权重 8）对两色 LRC（10），E-016 的同一模型（10 轮、联合电路分 sector 解码）；
  P4 gross：IBM 原电路（≤ 10）对 Strikis Fig. 12（11）——只做结构性领头阶（理想解码器），预算允许再加解码器。
  阳性对照：旋转表面码 d=5，好 / 坏 CNOT 顺序（钩子沿逻辑方向时 d_circ = 3，否则 5），MWPM 解码。
method: >
  LER(p) = Σ_w π_w(p) f_w（π_w：DEM 独立机制的 Poisson-二项精确分布；f_w：给定 w 个故障（按 Π q_i 条件分布）时解码失败概率）。
  (a) 固定权重 MC 测 f_w（BP-OSD = IBM 参数；Relay-BP relay5 分 sector；解码器先验固定为 p_dec = 1e-3 的 DEM）。
  (b) 低权重逻辑错误枚举（随机 BP-OSD 搜索 + 时空平移闭包，饱和检查），所有 t 子集拆分 → 结构失效核，
      逐个（或 HT 子抽样）交给实际解码器，得 C_t^D(p) = Σ_{失败核} Π q_i（理想解码器同法，按补集比较）。
  (c) 失效核密度模型 f_w = 1 − exp(−Σ_t c_t (w)_t)，c_t ≥ 0，结构核给出 c_{t_min} 下界，二项似然拟合全部 MC 层，
      bootstrap 给区间；低 p 外推 LER(p) = Σ_w π_w(p) f_w(模型)。
  (d) 方法验证：固定权重重构与直接 MC 在 p = 2e-3..4e-3 一致；最低权重 = 已证 d_circ；d=6 电路的 3|3 平局核解码器必失败其一；
      表面码阳性对照能看到预期的 p^2 对 p^3 差别。
  噪声：SD6（评估器 sd6）与 SI1000 系数（CX 作为原生双比特门，不编译成 CZ+H；电路距离按故障数计与噪声模型无关）。
prediction: >
  （跑前写下，未看任何本实验数据）
  1) 所有对照在 p ≥ 2e-3 的直接采样下差别不显著（比值 0.7–1.4），与 E-016 / E-004 一致。
  2) P1（[[54]] 6 对 7）：理想解码器领头阶比值 LER6/LER7 ∝ 1/p，p = 1e-3 约 1.5–3 倍，5e-4 约 3–6 倍，1e-4 约 10–30 倍。
     实际解码器（小码上 BP-OSD / Relay 在低权重接近理想）：5e-4 约 1.5–4 倍，1e-4 约 5–20 倍；交叉点 p* ≈ 1e-3–3e-3。
  3) SI1000 下 P1 收益比 SD6 更大（d=6 见证含 2 个复位翻转，SI1000 复位 2p），1e-4 比值高约 1.5–4 倍。
  4) P2（[[72]] 6 对 7）：与 P1 同量级，但端点码不同带来的熵差使交叉点更低（p* ≈ 5e-4–1.5e-3）。
  5) P3（BB108 8 对 10）：理想解码器 1e-4 约 10–30 倍（p^4 对 p^5，约 100 倍需要 p ≈ 1e-5）；
     BP-OSD 在低权重有自身失效（非结构），使其 1e-4 的收益只有 1.5–5 倍；Relay-BP 更接近理想（3–15 倍）。
     交叉点 p*（BP-OSD）≈ 3e-4–8e-4。
  6) P4（gross 10 对 11）：理想解码器领头阶 1e-4 约 3–10 倍（只结构）。
  7) 方法：固定权重重构与直接 MC 在 2e-3–4e-3 一致到 1.3 倍以内；最低权重 = 已证 d_circ；表面码对照在 1e-3 看到 > 5 倍。
