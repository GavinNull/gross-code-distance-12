reasoning: >
  现状（E-024a/b，未审计）：Fig. 12 扩展码类、颜色对称流水的最优周期 18（P = 8..17 体内 UNSAT，两种独立实现）；
  长周期的直接原因是 X0、Z2 两类的 CNOT 窗口在颜色对称下必须 ≥ 15（评估器规则窗口 ≤ P − 3）。降对称：|H| = 12 排除 P ≤ 11，
  所有 |H| ≥ 2 排除 P = 8；|H| ≤ 8 与逐校验自由 P = 9..17 未决定。失败原因：帧模型 nogood 的 CEGAR 每条子句只排除一小块时序（轮数不收敛），
  SA 景观崎岖，颜色对称 UNSAT 核搬到逐校验族后各平移像不再互相牵制。
  本实验的新方法：
  (A) 结构推理：在颜色对称、限制 X0（Z2）窗口 ≤ 14 的 UNSAT 问题里提取极小逻辑核，写出它的约束图（负环），看逐校验自由下能否拆开；
  (B) 精确的惰性逻辑编码（替代 nogood）：每个已加入的逻辑用“存在负权环”的精确布尔编码（约束图上的 0/1 环流 + 基数约束，
      或枚举简单环），所以一个逻辑一旦加入就对全部时序精确生效；逻辑总数有限（每侧 4224，建模 4416），轮数有上界；
  (C) 局部化下界：固定一个 X0 校验 a 的窗口 ≤ 14，只保留与 a 邻近的校验变量和逻辑（丢逻辑对 UNSAT 安全），逐校验自由下求解；
      若每个 X0 校验都 UNSAT，则逐校验自由族 P ≤ 17 全部排除；
  (D) 周期挤压：从认证的 P = 18 电路出发，在 P = 17 上做以精确编码为目标的局部修复（正方向启发式）。
  可靠性依据：帧模型“模型可提升 ⇒ 体内真有权重 11 逻辑”（E-018 审计 C1，E-024a 2387/2387 精确核对）；只用部分逻辑对 UNSAT 安全。
  任何候选用审计脚本精确 lift（2026-10-10-E-021-scripts b_common/b3）到 E-024a anyr.py 或 E-024b anyR_wrap.py 所需的 R，两基底。
