id: E-018-gross-interleaved-12
hypothesis: H-004（冲 PRL：gross code 是否存在 d_circ = 12 的单辅助比特交错电路——2603.05481 v2 §IV.3 的开放问题）
reasoning: >
  （lead）Prop. 3 的下界只依赖每个校验的 CNOT 顺序；gross 的任何顺序都有 d_ext ≤ 11（Prop. 4 的单检查上界），所以 Prop. 3 永远证不出 12。
  但 E-015 的 ibm_lift 方法能在 d_ext < d_circ 时证明：任何权重 = d_ext 的不可检测电路错误，必映到一个权重 d_ext 的扩展码逻辑错误（各故障映到不同列），
  于是只需枚举这些扩展码逻辑错误并对每个做精确检查。Strikis Theorem 1：从非交错电路只改时序引入交错，距离不降。
  所以路线是：从已证明 = 11 的 Fig. 12 出发，设计交错时序拆掉权重 11 的电路错误，再用 lift 方法证明 12。
stage_a: 可行性——枚举 Fig. 12 扩展码（两侧）权重 11 的逻辑错误数量（DFS W=11，计全部解），据此估计 lift 证明的计算量。
prediction: >
  （跑前写下）1) 每侧权重 11 的扩展码逻辑错误在 10^4–10^6 个之间（按对称轨道约为其 1/24）；
  2) 若在 10^5 以内，lift 证明在本机可行（每个逻辑错误的故障分组乘积约 10^4–10^6，折半后可算）；
  3) 存在保持 Fig. 12 各校验顺序、只改时序的交错电路，使评估器上界达到 12（约三成）。
budget: {cpu_hours: 24, llm_tokens: 0, num_workers: 6}
