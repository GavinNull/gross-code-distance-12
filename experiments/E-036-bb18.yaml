  4: 实验电路的精确 SD6 d_circ（R = 1..Rmax，两基底，复位版与不复位版），并给任意 R 论证
  5: 设计 d_circ = d 的单辅助比特电路，最短周期；受约束与不受约束两种；精确认证（直接 DEM 穷举 + 任意 R）
