hypothesis: H-004 方法外推（PI 2026-10-25）：把扩展码 / Cor. 1 / 扩展 lift / 直接 DEM 搜索用到浙大-清华 Kunlun 实验的小 BB 码 [[18,4,4]] 与 [[18,6,3]]
source: >
  Wang et al., "Demonstration of low-overhead quantum error correction codes", Nature Physics 2026, DOI 10.1038/s41567-025-03157-4；
  arXiv 2505.09684v1（WebFetch 只读）。码：l = m = 3，x = S3⊗I3，y = I3⊗S3，A = x + 1 + y^2，B = y + 1 + x^2，H_X = [A|B]，H_Z = [B^T|A^T]（= H_X）。
  实验只测 14 个校验：去掉冗余的 X2、X8、Z3、Z4；[[18,6,3]] 再去掉 X5、Z5（12 个校验）。电路：SI Fig. S3，7 层 CZ（ref. 34 = IBM 2308.07915 的 CNOT 序，CNOT 换成 CZ+H），
  所有校验每周期开头制备、结尾测量，不复位；芯片连通性 = 这 14 个校验的 Tanner 图（每个校验比特只连自己的 6 个数据比特）。
  噪声（SI Tab. S1）：H 8.0e-4，idle 3.5e-3，DD(X) 1.09e-2，DD(Z) 1.59e-2，CZ 9.8e-3，校验测量 4.03e-2，数据读出 3.29e-2。
reasoning: >
  码极小（n = 18），d = 4 / 3，所以所有判定都能精确穷举：d_ext 对每校验顺序类型（每侧 90 类）用“≤ d−1 列的扩展逻辑”子句 + 穷举/SAT；
  d_circ 直接在完整 SD6 DEM 上用中间相遇穷举权重 ≤ d−1（不依赖扩展码、列表、引理），见证在 DEM 上核验；任意 R 用 E-028 的分离 + 周期性归纳
  （不回绕电路，R' ≤ w + 3），回绕电路用 E-024a 间隙论证或把 R 算到覆盖 R'。
  芯片约束：连通性只允许每个校验比特与其 6 个数据比特作用，所以“受约束”= 只用实验的 14（或 12）个校验的单辅助比特电路；“不受约束”= 18 个校验全测（36 比特）。
