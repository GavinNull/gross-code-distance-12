id: E-022-morphing-criterion
hypothesis: H-006（morphing 何时掉距离）——PRL 升级 B 线
question: >
  把 E-019 的 80 个两轮 morphing 电路（72 个 d_circ = d̃，8 个 < d̃）提炼成定理或尖锐的结构判据：
  (1) 一个只依赖端点码与“有效错误集合”的扩展码，其距离（精确或上下界）等于 d_circ；
  (2) 保距离的充分条件与掉距离的充分条件；(3) 在推导时没用过的电路上先写预测、再跑精确管线检验。
sources: >
  2407.16336v3（Shaw–Terhal morphing，Table I/IV/VIII/IX，本地文本副本）；2604.09797 Prop. 1（折叠）；
  2603.05481（Strikis 扩展码，Prop. 3）；E-017、E-019 及其审计脚本。
prediction_stage0: >
  （2026-10-10，跑前写下，只读过 E-019 日志与见证解剖，未做任何新计算）
  P0-1) 把半周期内每个故障前推到半周期末，得到 (C~_c 上的数据错误 b_f, 本轮同基底测量翻转 rho_f)；
        单轮实例的不可探测逻辑错误 <=> sum rho = 0 且 sum b 是 C~_c 的非平凡逻辑算子。由此定义的“morphing 扩展码”
        的距离应与 E-019 的 d_circ 在全部 80 个电路 × 2 基底上逐个相等（约 90%；若不等，是推导漏了某类故障）。
  P0-2) 对称地后推到半周期起点得到 (C~_p 上的 a_f, 复位翻转 r_f)。猜想：每个故障要么 r_f = 0 要么 rho_f = 0
        （约 50%，没有把握）；若成立，则 d_circ >= min(d(Ext_p), d(Ext_c))，Ext 为只含“单侧无旗”故障列的扩展码，
        可以作为便宜的保距离充分条件。
  P0-3) 掉距离的 8 个电路的最小见证中，至少一半故障是“放大故障”（|b_f| >= 2 或 |a_f| >= 2），
        保距离电路的最小见证就是端点码逻辑算子（全部单比特数据错误）（约 70%）。
stage0_outcome: >
  （2026-10-10 训练集 80 电路结果，详见日志）P0-1 对：224/224 实例（56 小母码电路 × 2 基底 × 2 种半周期相位）扩展码距离 = E-019 d_circ。
  P0-2 错：多数故障两侧都带旗（bb108：1134 个中 702 个），单侧无旗扩展码不能给下界。P0-3 大体对（见证 = 起点数据错误 + 中点附近的带旗钩子链）。
heldout_set: >
  296 个新电路（全部按 analyse() 推导验证合法）：项目码 [[120,8,12]]p（f_x）、[[124,10,10]]p（f_y）、2408.10001 的 WMc[[108,12,6]]（f_x）
  与 WM[[180,8,16]]（f_x）各 8 个变体；外加 18 个随机权重 6 BB 码（newcodes.py random 1..3，N ≤ 60，k ≥ 4）的全部合法 (同态, 变体)。
  端点码距离 d~ 已算（enddist_*.json，只依赖端点码，不涉及电路故障）。尚未对任何新电路计算扩展码或跑 E-019 管线。
heldout_predictions_tierB: >
  （2026-10-10，只知道 d~，未算任何新电路的扩展码 / d_circ；简单结构规则的预注册，预期部分会失败）
  B1) 下界猜想：每个新电路 d_circ >= ceil(2 d~ / 3)（训练集 8 个掉距离电路都恰好或高于此界；约 75%）。
  B2) d~ <= 5 的电路全部保距离（训练集掉距离只出现在 d~ = 8；约 70%）。
  B3) 同一 (码, 同态) 内，若某个 Table IV（std）变体掉距离，则 4 个 std 变体都掉（训练集 bb108 如此；约 60%）。
  B4) 两个基底的 d_circ 总相等（训练集 160/160；约 85%）。
  B5) d~ >= 3 的新电路中掉距离的比例在 5%–30%（训练集 8/80 = 10%）。
heldout_predictions_tierA: >
  （扩展码算出后、跑 E-019 管线与 auditor 独立电路前追加；见下一次提交）
