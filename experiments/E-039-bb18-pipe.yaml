  4) N7 at R = 1 can reach d_circ = 4: 70%; at R = 2: 40%.
  5) merged Mg8 has a d_circ = 4 schedule: 25%; Mg7: 10%.
  6) static HH/HHM/DDH/DHH patterns cut the number of CEGAR iterations for W8 by >= 10x vs E-038's run: 60%.
