id: E-012-bb108-six-colour
hypothesis: H-004
question: 由见证结构推出的六色着色（x mod 3）×（y mod 2）能否让 BB108 的 X 侧达到 d_ext = 10？
reasoning: >
  （lead，依据 E-011 见证构成）三色着色下的权重 8 见证都由 4 个校验的长度 4 钩子残余拼成，校验位于矩形 {x0, x0+1} × {y0, y0+3}。
  h=(1,0) 着色只看 x，y 与 y+3 永远同色同序，矩形拆不开。Δy=3 是奇数，按 y 奇偶着色恰好把它们分开 → 六色（x mod 3, y mod 2）。
  权重 9 见证（Δy=2，同奇偶）不一定被拆开，只能指望块顺序避开。
prediction: >
  （跑前写下）1) 六色着色能消除全部权重 8 的见证（把握约七成）；
  2) 能达到 d_ext ≥ 10（多种子加大力度后仍找不到 ≤9）的把握约三成五，主要障碍是 Δy=2 型的权重 9 见证。
method: >
  随机爬山 + 重启（search/noninterleaved/six_colour.py）：状态为 6 个颜色各自的块顺序（取自 16 个能通过单检查上限的块顺序），须满足合法性；
  评估用启发式找错器（2 个种子 × 300 次试验）；达到 10 的状态用 3 个新种子 × 1000 次试验加大力度复核，扛住才算候选。
  对照：同一评估预算下的纯随机采样（检验爬山是否比随机强，即 H-002 的经典版本）。
budget: {cpu_hours: 10, llm_tokens: 0, num_workers: 8}
