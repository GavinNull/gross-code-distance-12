[project]
name = "qec-ai-search"
version = "0.1.0"
description = "AI-driven search for quantum error-correcting codes and fault-tolerant circuits"
requires-python = ">=3.12,<3.13"
dependencies = [
    # QEC 模拟与解码
    "stim",
    "sinter",
    "pymatching",
    "ldpc",
    "beliefmatching",
    "stimbposd",
    # 数值与图
    "numpy",
    "scipy",
    "networkx",
    "galois",
    # 电路级距离的精确/下界求解（evaluators/distance.py）
    "python-sat",
    "ortools",
    "sympy",
    # LLM 驱动的进化搜索
    "anthropic",
    # RL
    "gymnasium",
    "torch",
    # 实验管理与可视化
    "pandas",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "jupyterlab",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
markers = ["slow: 慢测试（gross code 距离回归等，单个约 2 分钟）；用 -m \"not slow\" 跳过"]
